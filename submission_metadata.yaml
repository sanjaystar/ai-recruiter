compute_environment_summary: "FILL_IN"  # e.g., "MacBook Pro M2, 16GB RAM, Python 3.11"

methodology_summary: >
  Hybrid semantic ranking system combining sparse TF-IDF retrieval (70%) with
  dense sentence-transformer embeddings (30%) for candidate-JD matching. 
  Candidates scored across 5 dimensions: skill taxonomy match with proficiency/assessment 
  weighting, career trajectory with taxonomy-alias relevance detection, behavioral 
  recruitability using Redrob engagement, availability, verification, market-demand, 
  and logistics signals including location/work-mode fit, trust/honeypot anomaly 
  detection, and JD-specific fit penalties for consulting-only careers, title-chasers, 
  and keyword stuffers. Architecture split into offline pre-computation (embeddings 
  + indexes) and online ranking (< 5 seconds, CPU-only).

