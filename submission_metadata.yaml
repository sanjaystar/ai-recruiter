# AI tools declaration  (transparency only — not penalized)
# ============================================================================
ai_tools_used:
  - "Claude"

ai_usage_summary: |
  Used Claude (Claude Code) to review the ranking pipeline against the spec and to
  implement fixes: reviving the career-relevance signal, normalizing score
  components, adding a second honeypot check and a negative-domain penalty,
  correcting the tie-break to match the validator, and de-templating the reasoning.
  No candidate data was sent to any hosted LLM; the ranking step makes no network calls.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Two-stage semantic ranker. Offline (build_index.py): all-MiniLM-L6-v2 dense
  embeddings over each candidate's title, headline, summary, skills and job
  descriptions, plus per-role career embeddings — no TF-IDF/BM25 sparse index;
  relevance is purely semantic. Online (main.py): embed only the JD, then score all
  100K candidates on five components — skill match (taxonomy + platform assessments),
  semantic relevance (vectorized cosine similarity between the JD and each candidate's
  dense profile embedding, leaning on meaning so non-buzzword fits still surface),
  behavioral recruitability (the 23 Redrob signals), career fit (relevant tenure
  detected by semantically matching the JD against per-role career embeddings, plus
  progression and stability), and a trust/consistency score. Each component is min-max
  normalized to 0-100 and combined with JD-derived weights. Honeypots (expert-with-
  0-months and experience-exceeding-timeline) are forced out of the Top 100; candidates
  whose specialty is a JD-rejected domain (CV/speech/robotics) with no retrieval skills
  are penalized. Reasoning is generated deterministically from profile facts. Ranking
  step runs CPU-only, offline, in well under 5 minutes.

